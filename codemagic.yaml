# Codemagic: Haber Akışı iOS — imzalı derleme + TestFlight. Kurulum: docs/ios/HAZIRLIK.md
# Uygulama klasörü: news-aggregator/flutter_app
workflows:
  haber-akisi-ios:
    name: Haber Akışı iOS (TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Codemagic   # Codemagic → Team integrations'ta verilen anahtarın adı
    environment:
      groups:
        - haber_akisi_ios            # FIREBASE_IOS_API_KEY, FIREBASE_IOS_APP_ID, FIREBASE_IOS_SENDER_ID,
                                     # FIREBASE_IOS_STORAGE_BUCKET, ADMOB_IOS_APP_ID,
                                     # ADMOB_BANNER_ID_IOS, ADMOB_NATIVE_ID_IOS, ADMOB_INTERSTITIAL_ID_IOS
      flutter: stable
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: akinai.app1
      vars:
        APP_DIR: news-aggregator/flutter_app
    scripts:
      - name: Bağımlılıklar
        script: cd $APP_DIR && flutter pub get
      - name: İmzalama profilini uygula
        script: xcode-project use-profiles --project $APP_DIR/ios/Runner.xcodeproj
      - name: Gerçek AdMob uygulama kimliği
        script: |
          if [ -n "$ADMOB_IOS_APP_ID" ]; then
            sed -i '' "s|^ADMOB_APP_ID = .*|ADMOB_APP_ID = $ADMOB_IOS_APP_ID|" $APP_DIR/ios/Flutter/Release.xcconfig
          fi
      - name: Yapı numarası
        script: |
          LATEST=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0)
          echo "BUILD_NUMBER=$((LATEST + 1))" >> $CM_ENV
      - name: IPA derle
        script: |
          cd $APP_DIR
          flutter build ipa --release --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist \
            --dart-define=FIREBASE_IOS_API_KEY=$FIREBASE_IOS_API_KEY \
            --dart-define=FIREBASE_IOS_APP_ID=$FIREBASE_IOS_APP_ID \
            --dart-define=FIREBASE_IOS_SENDER_ID=$FIREBASE_IOS_SENDER_ID \
            --dart-define=FIREBASE_IOS_STORAGE_BUCKET=$FIREBASE_IOS_STORAGE_BUCKET \
            --dart-define=ADMOB_BANNER_ID_IOS=$ADMOB_BANNER_ID_IOS \
            --dart-define=ADMOB_NATIVE_ID_IOS=$ADMOB_NATIVE_ID_IOS \
            --dart-define=ADMOB_INTERSTITIAL_ID_IOS=$ADMOB_INTERSTITIAL_ID_IOS
    artifacts:
      - news-aggregator/flutter_app/build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
