<head>

<link rel="stylesheet" href="/style.css">
<script>
  // Telefona göre mağazaya yönlendir (masaüstünde iki bağlantı görünür)
  (function () {
    var ua = navigator.userAgent || '';
    var play = 'https://play.google.com/store/apps/details?id=akinai.app1&referrer=utm_source%3Dpaylasim';
    var ios = 'https://apps.apple.com/app/id6837488791';
    if (/android/i.test(ua)) location.replace(play);
    else if (/iphone|ipad|ipod/i.test(ua)) location.replace(ios);
  })();
</script>

<main style="max-width:560px;margin:48px auto;padding:0 20px;text-align:center">
  <h1>Haber Akışı</h1>

  <p><a href="https://play.google.com/store/apps/details?id=akinai.app1&amp;referrer=utm_source%3Dpaylasim">Google Play'den indir</a></p>
