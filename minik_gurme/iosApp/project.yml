# Minik Gurme — iPhone uygulaması. Xcode projesi bu dosyadan üretilir:
#   brew install xcodegen && cd iosApp && xcodegen generate
# Uygulamanın tamamı Kotlin ortak modülündedir (shared); burada yalnızca giriş noktası vardır.
name: MinikGurme
options:
  bundleIdPrefix: akinai
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "2.2"
    CURRENT_PROJECT_VERSION: "1"
    VERSIONING_SYSTEM: apple-generic
targets:
  MinikGurme:
    type: application
    platform: iOS
    sources:
      - path: iosApp
        excludes:
          - GoogleService-Info.plist   # Topluluk Firebase REST kullanır; SDK yapılandırması gerekmez
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDisplayName: Minik Gurme
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: tr
        CFBundleLocalizations: [tr, en]
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        CADisableMinimumFrameDurationOnPhone: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: akinai.minikgurme
        PRODUCT_NAME: MinikGurme
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        FRAMEWORK_SEARCH_PATHS: ["$(inherited)", "$(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"]
        OTHER_LDFLAGS: ["$(inherited)", "-framework", "Shared"]
        CODE_SIGN_STYLE: Automatic
    preBuildScripts:
      - name: Kotlin ortak modülünü derle
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          # Compose eklentisi görsel/yazı tipi çıktı klasörünü bu Xcode değişkenlerinden hesaplar; boş gelirse yedek değer ver
          export BUILT_PRODUCTS_DIR="${BUILT_PRODUCTS_DIR:-$TARGET_BUILD_DIR}"
          export UNLOCALIZED_RESOURCES_FOLDER_PATH="${UNLOCALIZED_RESOURCES_FOLDER_PATH:-${WRAPPER_NAME:-MinikGurme.app}}"
          export PLATFORM_NAME="${PLATFORM_NAME:-iphonesimulator}"
          echo "--- Xcode değişkenleri ---"
          env | grep -E '^(BUILT_PRODUCTS_DIR|UNLOCALIZED_RESOURCES_FOLDER_PATH|TARGET_BUILD_DIR|WRAPPER_NAME|CONTENTS_FOLDER_PATH|ARCHS|PLATFORM_NAME|SDK_NAME|CONFIGURATION|OTHER_LDFLAGS)=' || true
          echo "--------------------------"
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
