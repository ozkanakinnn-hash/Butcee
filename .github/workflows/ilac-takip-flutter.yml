name: İlaç Takip (Flutter)

on:
  push:
    paths: [ "ilac_takip/**", ".github/workflows/ilac-takip-flutter.yml" ]
  pull_request:
    paths: [ "ilac_takip/**" ]
  workflow_dispatch:

defaults:
  run:
    working-directory: ilac_takip

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true

      - name: Bağımlılıklar
        run: flutter pub get

      - name: Statik analiz
        run: flutter analyze

      - name: Birim testleri
        run: flutter test

      - name: Android SDK lisansları
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Debug APK
        run: flutter build apk --debug

      - uses: actions/upload-artifact@v5
        with:
          name: ilac-takip-debug-apk
          path: ilac_takip/build/app/outputs/flutter-apk/app-debug.apk
