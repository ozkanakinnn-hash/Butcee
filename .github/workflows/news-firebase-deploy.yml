name: Haber Akışı - Firebase'e Kur

# Elle çalıştırılır: GitHub → Actions → "Haber Akışı - Firebase'e Kur" → Run workflow
# Gerekli gizli değişken (Settings → Secrets and variables → Actions):
#   FIREBASE_SERVICE_ACCOUNT : Google Cloud hizmet hesabı JSON anahtarının tamamı
on:
  workflow_dispatch:
    inputs:
      project_id:
        description: "Firebase proje kimliği (ör. haber-akisi-12345)"
        required: true
      seed:
        description: "Örnek kategori ve kaynakları yükle"
        type: boolean
        default: true
      only_report:
        description: "Kurmadan yalnızca durum raporu (Make ayarı, bülten, canlı skor) — Firestore'a yazmaz"
        type: boolean
        default: false
      akis_now:
        description: "Kurmadan bir X akışını ŞİMDİ yazdır ve Make'e gönder (yok = kapalı)"
        type: choice
        options: [yok, gece, sabah, ogle, aksam, haftasonu]
        default: yok
      akis_onizle:
        description: "Akışı yalnızca yaz, Make'e gönderme"
        type: boolean
        default: false
      akis_liste:
        description: "Yalnızca akış aralığındaki haber listesini kayda yaz (göndermez)"
        type: boolean
        default: false
      akis_maddeler:
        description: "Hazır maddeler (JSON: {\"maddeler\":[...]}) — boşsa yapay zekâ yazar"
        required: false
        default: ""

permissions:
  contents: read
  models: read # akış denemesinde GitHub Models (ücretsiz yapay zekâ)

concurrency:
  group: news-firebase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: news-aggregator/firebase
    env:
      PROJECT_ID: ${{ inputs.project_id }}
      GCLOUD_PROJECT: ${{ inputs.project_id }}
      GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/sa.json
      FIREBASE_CLI_DISABLE_UPDATE_CHECK: "true"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Hizmet hesabı anahtarı
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT gizli değişkeni eklenmemiş. README'deki 'Otomatik kurulum' adımlarına bakın."
            exit 1
          fi
          printf '%s' "$SA" > "$GOOGLE_APPLICATION_CREDENTIALS"

      - name: Bağımlılıklar
        working-directory: news-aggregator/firebase/functions
        run: npm ci

      - name: Hizmet hesabı anahtarını onar
        # Secret kopyalanırken satır sonları bozulmuşsa firebase-tools giriş yapamıyordu ("Failed to authenticate").
        # Uygulama betiklerinin kullandığı onarımla düzeltilmiş JSON dosyaya geri yazılır (içerik kayda basılmaz).
        working-directory: news-aggregator/firebase/functions
        run: |
          node -e "const f=process.env.GOOGLE_APPLICATION_CREDENTIALS; const {readServiceAccount}=require('./scripts/init-admin'); require('fs').writeFileSync(f, JSON.stringify(readServiceAccount(f)));"

      - name: Testler
        if: ${{ !inputs.only_report && (inputs.akis_now == '' || inputs.akis_now == 'yok') }}
        working-directory: news-aggregator/firebase/functions
        run: npm test

      - name: Firestore veritabanı (yoksa oluştur)
        if: ${{ !inputs.only_report && (inputs.akis_now == '' || inputs.akis_now == 'yok') }}
        run: |
          if npx -y firebase-tools@15 firestore:databases:get "(default)" --project "$PROJECT_ID" --non-interactive >/dev/null 2>&1; then
            echo "Firestore veritabanı zaten var."
          else
            npx -y firebase-tools@15 firestore:databases:create "(default)" --location europe-west1 --project "$PROJECT_ID" --non-interactive
          fi

      - name: Kurallar, dizinler ve Cloud Functions'ı yayınla
        if: ${{ !inputs.only_report && (inputs.akis_now == '' || inputs.akis_now == 'yok') }}
        run: npx -y firebase-tools@15 deploy --only firestore,functions --project "$PROJECT_ID" --non-interactive --force

      - name: Örnek kategori ve kaynakları yükle
        if: ${{ inputs.seed && !inputs.only_report && (inputs.akis_now == '' || inputs.akis_now == 'yok') }}
        working-directory: news-aggregator/firebase/functions
        run: npm run seed

      - name: İlk haber çekimi
        if: ${{ !inputs.only_report && (inputs.akis_now == '' || inputs.akis_now == 'yok') }}
        working-directory: news-aggregator/firebase/functions
        run: npm run fetch:once

      - name: Akışı şimdi yazdır ve gönder
        if: ${{ inputs.akis_now != '' && inputs.akis_now != 'yok' }}
        working-directory: news-aggregator/firebase/functions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AKIS_LISTE: ${{ inputs.akis_liste && '1' || '' }}
          AKIS_MADDELER: ${{ inputs.akis_maddeler }}
        run: node scripts/akis-simdi.js "${{ inputs.akis_now }}" ${{ inputs.akis_onizle && '--onizle' || '' }}

      - name: Durum raporu (yalnızca okur)
        if: always()
        working-directory: news-aggregator/firebase/functions
        run: node scripts/durum-raporu.js || true

      - name: Anahtarı sil
        if: always()
        run: rm -f "$GOOGLE_APPLICATION_CREDENTIALS"
