name: Haber Akışı - X Bülteni (Make)

# Hafta içi günde 4 kez: Firestore'daki haberler → ücretsiz yapay zekâ (Gemini ücretsiz katmanı, yoksa
# GitHub Models) ile telifsiz özet zinciri → Make webhook'u → X. Hafta sonu gönderilmez.
# Kurulum: news-aggregator/docs/MAKE_X_BULTEN.md
# Gizli değişkenler: FIREBASE_SERVICE_ACCOUNT (zorunlu), MAKE_WEBHOOK_URL (yoksa yalnızca deneme),
#                    GEMINI_API_KEY (isteğe bağlı; yoksa GitHub Models kullanılır), APP_LINK (isteğe bağlı)
# Saatler UTC, Pzt–Cum: 04:33=07:33, 09:33=12:33, 15:33=18:33, 20:33=23:33 (İstanbul).
on:
  schedule:
    - cron: "33 4,9,15,20 * * 1-5"
  workflow_dispatch:
    inputs:
      slot:
        description: "Akış"
        type: choice
        options: [auto, sabah, ogle, aksam, gece]
        default: auto
      dry_run:
        description: "Sadece metni göster, Make'e gönderme"
        type: boolean
        default: true
      force:
        description: "Hafta sonu da çalıştır (deneme için)"
        type: boolean
        default: false

permissions:
  contents: read
  models: read # GitHub Models (ücretsiz yapay zekâ) için

concurrency:
  group: news-x-bulletin
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: news-aggregator/firebase/functions
    steps:
      - name: Anahtar kontrolü
        id: key
        working-directory: .
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "::notice::FIREBASE_SERVICE_ACCOUNT eksik; bülten atlandı."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            KEY="$RUNNER_TEMP/sa.json"
            printf '%s' "$SA" > "$KEY"
            echo "GOOGLE_APPLICATION_CREDENTIALS=$KEY" >> "$GITHUB_ENV"
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.key.outputs.ready == 'true'

      - uses: actions/setup-node@v5
        if: steps.key.outputs.ready == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: news-aggregator/firebase/functions/package-lock.json

      - name: Bağımlılıklar
        if: steps.key.outputs.ready == 'true'
        run: npm ci --omit=dev

      - name: Bülteni yaz ve gönder
        if: steps.key.outputs.ready == 'true'
        env:
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_LINK: ${{ secrets.APP_LINK }}
          SLOT: ${{ inputs.slot || 'auto' }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
          FORCE: ${{ inputs.force && 'true' || 'false' }}
        run: node scripts/send-bulletin.js

      - name: Anahtarı sil
        if: always()
        working-directory: .
        run: rm -f "$RUNNER_TEMP/sa.json"
