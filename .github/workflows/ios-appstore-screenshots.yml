# App Store için 6,9" iPhone ekran görüntüleri (TR + EN) → docs/appstore/raw/
name: iOS App Store ekran görüntüleri

on:
  workflow_dispatch:
  push:
    paths: [ "ios/scripts/appstore_shots.sh", ".github/workflows/ios-appstore-screenshots.yml" ]

permissions:
  contents: write

concurrency:
  group: ios-appstore-shots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shots:
    runs-on: macos-15-intel
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
      - name: En yeni Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | grep -v beta | sort -V | tail -1)"
          xcodebuild -version
          xcrun simctl list devices available | grep "Pro Max" || true
      - name: Simülatör için derle
        run: |
          brew install xcodegen
          cd ios && xcodegen generate
          set -o pipefail
          xcodebuild -project RamazanRehberi.xcodeproj -scheme RamazanRehberi -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath simbuild \
            -skipPackagePluginValidation -skipMacroValidation CODE_SIGNING_ALLOWED=NO build 2>&1 | tail -5
      - name: Ekran görüntüleri
        run: |
          APP=$(find ios/simbuild/Build/Products/Debug-iphonesimulator -maxdepth 1 -name "*.app" | head -1)
          bash ios/scripts/appstore_shots.sh "$APP" docs/appstore/raw
      - name: Görüntüleri kaydet
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/appstore/raw
          git commit -m "App Store ekran görüntüleri (6,9\") [skip ci]" || exit 0
          for i in 1 2 3; do git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0; git rebase --abort 2>/dev/null; sleep 5; done; exit 1
