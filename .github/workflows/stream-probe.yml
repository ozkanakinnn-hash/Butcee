name: Radio Stream Probe

on:
  push:
    paths: [ ".github/workflows/stream-probe.yml" ]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Diyanet radio streams
        run: |
          UA="Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Mobile Safari/537.36"
          for page in https://www.diyanetradyo.com/Canli-Dinle https://www.diyanetradyo.com https://www.diyanetkuranradyo.com/canli-dinle https://www.diyanetkuranradyo.com; do
            echo "== PAGE $page =="
            curl -sSk -m 20 -L -A "$UA" "$page" -o /tmp/p.html -w "HTTP %{http_code}\n" || true
            grep -oiE '<title>[^<]*' /tmp/p.html | head -1
            # her yayın adresini çevresindeki metinle birlikte göster
            grep -oE '.{0,160}https?://[^"'"'"' <>]+(m3u8|aac|mp3)[^"'"'"' <>]*' /tmp/p.html | sed 's/<[^>]*>//g' | head -10
          done
          for u in $(cat /tmp/p.html 2>/dev/null | grep -oE 'https?://[^"'"'"' <>]+m3u8' | sort -u) \
            https://eustr76.mediatriple.net/videoonlylive/mtikoimxnztxlive/broadcast_5e3c1171d7d2a.smil/playlist.m3u8 \
            https://eustr76.mediatriple.net/videoonlylive/mtikoimxnztxlive/broadcast_5e3c14192aa92.smil/playlist.m3u8 \
            https://eustr76.mediatriple.net/videoonlylive/mtikoimxnztxlive/broadcast_5e3c1520b2626.smil/playlist.m3u8 ; do
            echo "=================================================="
            echo "URL: $u"
            curl -sS -m 15 -L -A "$UA" -o /tmp/body -w "HTTP %{http_code} | type %{content_type}\n" "$u" || echo FAIL
            head -c 400 /tmp/body; echo
            child=$(grep -v '^#' /tmp/body | grep -E 'm3u8|\.ts|\.aac' | head -1)
            if [ -n "$child" ]; then
              case "$child" in http*) c="$child";; *) c="$(dirname "$u")/$child";; esac
              curl -sS -m 15 -L -A "$UA" -o /tmp/child -w "  child HTTP %{http_code}\n" "$c" || echo "  child FAIL"
              seg=$(grep -v '^#' /tmp/child | head -1)
              [ -n "$seg" ] && { case "$seg" in http*) s="$seg";; *) s="$(dirname "$c")/$seg";; esac; curl -sS -m 15 -L -A "$UA" -o /tmp/seg -w "  segment HTTP %{http_code} | size %{size_download} | type %{content_type}\n" "$s"; file /tmp/seg; }
            fi
          done
