# Minik Gurme iOS: App Store Connect'e (TestFlight) imzalı yükleme. Mac, iPhone ve Codemagic gerekmez.
# Başlatma: minik_gurme/iosApp/RELEASE_VERSION değişip gönderildiğinde (ya da Actions → Run workflow).
# Sırlar (depoda zaten var, Ezan & Vakit ile aynı): APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID, ASC_PRIVATE_KEY (API anahtarı Admin).
# Bundle kimliği (akinai.minikgurme) yoksa kendiliğinden kaydedilir; App Store Connect'te uygulama kaydı yoksa
# iş "UYGULAMA_KAYDI_YOK" diye durur → Apps → + → New App ile oluşturup yeniden başlatın.
name: Minik Gurme iOS App Store yükleme

on:
  workflow_dispatch:
  push:
    paths:
      - "minik_gurme/iosApp/RELEASE_VERSION"
      - "minik_gurme/iosApp/scripts/**"
      - ".github/workflows/minik-gurme-ios-release.yml"

permissions:
  contents: read

concurrency:
  group: minik-ios-release
  cancel-in-progress: false

jobs:
  upload:
    runs-on: macos-15-intel        # macos-latest/macos-26 Kasım 2026'da sunucu alamadı
    timeout-minutes: 120
    env:
      BUNDLE_IDS: akinai.minikgurme
      BUNDLE_NAME: Minik Gurme
      REQUIRE_APP_RECORD: "1"
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - name: Sürüm ve sırlar
        run: |
          V="$(tr -d ' \n\r' < minik_gurme/iosApp/RELEASE_VERSION)"
          echo "VERSION=$V" >> "$GITHUB_ENV"
          echo "Sürüm: $V, yapı: $BUILD_NUMBER"
          missing=0
          for v in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY; do
            if [ -z "${!v}" ]; then echo "::error::$v sırrı tanımlı değil"; missing=1; fi
          done
          [[ "$V" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || { echo "::error::Sürüm biçimi hatalı: $V"; missing=1; }
          exit $missing

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: En yeni Xcode 26
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | grep -v beta | sort -V | tail -1)"
          xcodebuild -version

      - name: API anahtarı ve Python
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          KEY="$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"
          python3 - "$KEY" <<'PY'
          import os, re, sys, textwrap
          body = re.sub(r"-----(BEGIN|END)[A-Z ]*-----", "", os.environ["ASC_PRIVATE_KEY"])
          body = re.sub(r"[^A-Za-z0-9+/=]", "", body)
          if len(body) < 100:
              sys.exit("ASC_PRIVATE_KEY çok kısa görünüyor.")
          open(sys.argv[1], "w").write("-----BEGIN PRIVATE KEY-----\n" + "\n".join(textwrap.wrap(body, 64)) + "\n-----END PRIVATE KEY-----\n")
          PY
          chmod 600 "$KEY"
          openssl pkey -in "$KEY" -noout 2>/dev/null || { echo "::error::ASC_PRIVATE_KEY geçerli bir özel anahtar değil."; exit 1; }
          echo "KEY_PATH=$KEY" >> "$GITHUB_ENV"
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q "PyJWT[crypto]"

      - name: Bundle kimliği, geçici dağıtım sertifikası ve App Store profili
        run: '"$RUNNER_TEMP/venv/bin/python" minik_gurme/iosApp/scripts/asc_signing.py setup "$RUNNER_TEMP/signing"'

      - name: Proje (XcodeGen) ve Android SDK yolu
        run: |
          brew install xcodegen
          echo "sdk.dir=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" > minik_gurme/local.properties
          cd minik_gurme/iosApp && xcodegen generate

      - name: "Arşivle (imzalı; Kotlin ortak modülü derleme adımında derlenir)"
        working-directory: minik_gurme/iosApp
        run: |
          set -o pipefail
          xcodebuild -project MinikGurme.xcodeproj -scheme MinikGurme -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/MinikGurme.xcarchive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$APP_PROFILE" OTHER_CODE_SIGN_FLAGS="--keychain $SIGN_KEYCHAIN" \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            archive 2>&1 | tee archive.log | grep -E "error:|e: |\*\* ARCHIVE|BUILD FAILED" || true
          grep -q "ARCHIVE SUCCEEDED" archive.log

      - name: Arşiv hataları
        if: failure()
        run: |
          grep -E "error:|^e: |Provisioning|signing|FAILURE|What went wrong" -A3 minik_gurme/iosApp/archive.log | head -80 || true

      - name: App Store Connect'e yükle
        working-directory: minik_gurme/iosApp
        run: |
          python3 - "$RUNNER_TEMP/signing/profiles.json" <<'PY'
          import json, os, plistlib, sys
          plistlib.dump({"method": "app-store-connect", "destination": "upload", "teamID": os.environ["APPLE_TEAM_ID"],
                         "signingStyle": "manual", "signingCertificate": "Apple Distribution",
                         "provisioningProfiles": json.load(open(sys.argv[1])), "uploadSymbols": True,
                         "manageAppVersionAndBuildNumber": False}, open("ExportOptions.plist", "wb"))
          PY
          set -o pipefail
          xcodebuild -exportArchive -archivePath build/MinikGurme.xcarchive -exportOptionsPlist ExportOptions.plist \
            -exportPath build/export -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee export.log | tail -30
          grep -qE "EXPORT SUCCEEDED|Upload succeeded|Uploaded" export.log
          echo "### ✅ Minik Gurme $VERSION (yapı $BUILD_NUMBER) App Store Connect'e yüklendi" >> "$GITHUB_STEP_SUMMARY"

      - name: Geçici sertifika ve profili sil
        if: always()
        run: |
          [ -x "$RUNNER_TEMP/venv/bin/python" ] && "$RUNNER_TEMP/venv/bin/python" minik_gurme/iosApp/scripts/asc_signing.py cleanup "$RUNNER_TEMP/signing" || true
          rm -rf "$RUNNER_TEMP/keys" "$RUNNER_TEMP/signing"
