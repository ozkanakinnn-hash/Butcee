# Haber Akışı: App Store inceleme notunu ve video ekini günceller; isteğe bağlı yeniden gönderir (App Store Connect API).
name: News iOS inceleme yanıtı

on:
  workflow_dispatch:
    inputs:
      resubmit:
        description: "Güncelledikten sonra yeniden incelemeye gönder (1/0)"
        required: false
        default: "0"
  # Not ya da video değişince yalnızca not ve eki günceller (yeniden gönderim elle, resubmit=1 ile)
  push:
    branches: ["claude/haber-akisi-2026-11"]
    paths:
      - "news-aggregator/docs/ios/inceleme-video/notes.txt"
      - "news-aggregator/docs/ios/inceleme-video/haber-akisi-review.mp4"
      - ".github/workflows/news-ios-review-reply.yml"

permissions:
  contents: read

jobs:
  reply:
    runs-on: ubuntu-latest
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
      BUNDLE_ID: akinai.app1
      NOTES_FILE: news-aggregator/docs/ios/inceleme-video/notes.txt
      ATTACHMENT: news-aggregator/docs/ios/inceleme-video/haber-akisi-review.mp4
      RESUBMIT: ${{ github.event.inputs.resubmit }}
    steps:
      - uses: actions/checkout@v5
      - name: Anahtar
        run: |
          KEY="$RUNNER_TEMP/AuthKey.p8"
          python3 - "$KEY" <<'PY'
          import os, re, sys, textwrap
          body = re.sub(r"-----(BEGIN|END)[A-Z ]*-----", "", os.environ["ASC_PRIVATE_KEY"])
          body = re.sub(r"[^A-Za-z0-9+/=]", "", body)
          open(sys.argv[1], "w").write("-----BEGIN PRIVATE KEY-----\n" + "\n".join(textwrap.wrap(body, 64)) + "\n-----END PRIVATE KEY-----\n")
          PY
          echo "KEY_PATH=$KEY" >> "$GITHUB_ENV"
          pip install -q "PyJWT[crypto]"
      - name: İnceleme bilgisini güncelle
        run: python3 news-aggregator/flutter_app/ios/scripts/asc_review.py
      - name: Anahtarı sil
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
