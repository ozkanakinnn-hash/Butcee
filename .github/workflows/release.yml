name: Play Store Release (AAB)

# Elle çalıştırılır: Actions → "Play Store Release (AAB)" → Run workflow.
# Gerekli GitHub gizli değişkenleri (Settings → Secrets and variables → Actions):
#   KEYSTORE_BASE64   : yükleme anahtarı (.jks) dosyasının base64 hâli
#   STORE_PASSWORD    : anahtar deposu şifresi
#   KEY_PASSWORD      : "upload" anahtarının şifresi
#   ADMOB_APP_ID      : ca-app-pub-XXXX~YYYY
#   ADMOB_BANNER_ID   : ca-app-pub-XXXX/ZZZZ
#   GOOGLE_SERVICES_JSON : Firebase yapılandırması (isteğe bağlı)
on:
  workflow_dispatch:

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Android SDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36.1" "platform-tools" || true
      - name: Gizli değişkenleri kontrol et
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
        run: |
          [ -n "$KEYSTORE_BASE64" ] || { echo "::error::KEYSTORE_BASE64 tanımlı değil"; exit 1; }
          [ -n "$ADMOB_APP_ID" ] || echo "::warning::ADMOB_APP_ID yok; yayın sürümü TEST reklam kimlikleriyle derlenir"
      - name: Anahtar ve Firebase dosyaları
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then echo "$GOOGLE_SERVICES_JSON" > app/google-services.json; fi
      - uses: gradle/actions/setup-gradle@v5
      - name: AAB derle (telefon + saat)
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_BANNER_ID: ${{ secrets.ADMOB_BANNER_ID }}
        run: ./gradlew --no-daemon --stacktrace :app:bundleRelease :wear:bundleRelease
      - uses: actions/upload-artifact@v5
        with:
          name: play-store-aab
          path: |
            app/build/outputs/bundle/release/*.aab
            wear/build/outputs/bundle/release/*.aab
            app/build/outputs/mapping/release/mapping.txt
